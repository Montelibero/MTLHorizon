# Watch list for `python -m app.backfill import-config --file <file>`.
#
# Copy to local/tracking.yaml (ignored by git) and edit. Nothing here is a
# list of real users: the market is the public test market of stage 02 and
# the accounts are placeholders.
#
# Importing the file again changes nothing unless the file did. A stored
# flag is only changed with --apply-changes. Entries left out of a later
# file are not removed: collected history stays.

assets:
  - code: MTLRECT
    issuer: GACKTN5DAZGWXRWB2WLM6OPBDHAMT6SJNGLJZPQMEZBUR4JUGBX2UK7V
  - code: EURMTL
    issuer: GACKTN5DAZGWXRWB2WLM6OPBDHAMT6SJNGLJZPQMEZBUR4JUGBX2UK7V
  # XLM is written as `native`; it needs no code or issuer.
  # - native: true
  # `discover: true` is a rule of its own, apart from `enabled`: the accounts
  # that hold a trustline to the asset are looked for
  # (`python -m app.discovery run`) and added to the accounts below. It
  # changes only with --apply-changes, as `enabled` does. Native cannot be
  # discovered: every account holds it.
  # - code: EURMTL
  #   issuer: GACKTN5DAZGWXRWB2WLM6OPBDHAMT6SJNGLJZPQMEZBUR4JUGBX2UK7V
  #   discover: true

# A market is an unordered pair. Naming it the other way round is the same
# market; listing both orders is an error.
markets:
  - base: MTLRECT:GACKTN5DAZGWXRWB2WLM6OPBDHAMT6SJNGLJZPQMEZBUR4JUGBX2UK7V
    counter: EURMTL:GACKTN5DAZGWXRWB2WLM6OPBDHAMT6SJNGLJZPQMEZBUR4JUGBX2UK7V

# The three lists are independent: an enabled account, an enabled asset and
# an enabled market are three rules, and a record is collected when any of
# them says so. `enabled` may be left out: a new entry is then enabled, and
# one that is stored already keeps the flag it has. `reason` is required:
# say why the entry is watched.
accounts:
  - address: GACKTN5DAZGWXRWB2WLM6OPBDHAMT6SJNGLJZPQMEZBUR4JUGBX2UK7V
    enabled: false
    reason: issuer of the market's assets; too active to load without a decision
