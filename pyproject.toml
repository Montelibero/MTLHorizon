[project]
name = "mtl-horizon"
version = "0.1.0"
description = "Read-only Stellar history indexer for Montelibero"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.36",
    "stellar-sdk>=17.0",
    "uvicorn>=0.34",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
